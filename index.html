<!doctype html>
<html lang="en" data-theme="light" data-theme-mode="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="AtomJS documentation">
  <meta name="color-scheme" content="light dark">
  <title>AtomJS Docs</title>
  <link rel="icon" href="assets/logo.png" type="image/png">
  <link rel="stylesheet" href="assets/styles.css">
  <script>
    (() => {
      let mode = 'system';
      try { mode = localStorage.getItem('atomjs-theme') || 'system'; } catch (_) {}
      const dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      const resolved = mode === 'system' ? (dark ? 'dark' : 'light') : mode;
      document.documentElement.dataset.themeMode = mode;
      document.documentElement.dataset.theme = resolved;
      document.documentElement.style.colorScheme = resolved;
    })();
  </script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="header-start">
        <button class="icon-button menu-button" id="menuButton" type="button" aria-label="Open navigation" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <a class="brand" href="#/getting-started" aria-label="AtomJS documentation home">
          <img class="brand-mark" src="assets/logo.png" alt="">
          <span>AtomJS</span>
        </a>
      </div>

      <button class="search-trigger" id="searchTrigger" type="button" aria-label="Search documentation">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
        <span class="search-label">Search documentation…</span>
        <span class="shortcut"><kbd>⌘</kbd><kbd>K</kbd></span>
      </button>
    </div>
  </header>

  <div class="mobile-overlay" id="mobileOverlay"></div>

  <div class="layout">
    <aside class="sidebar" aria-label="Documentation navigation">
      <div class="sidebar-scroll" id="sidebarNav">
        <div class="sidebar-loading">Loading navigation…</div>
      </div>
      <a class="domain-credit" href="https://js.org" target="_blank" rel="noreferrer">
        <span class="domain-badge">JS</span>
        <span><strong>Special thanks to js.org</strong><small>for providing the domain</small></span>
      </a>
    </aside>

    <main id="mainContent" tabindex="-1">
      <div class="page-loading">
        <div class="loading-line loading-title"></div>
        <div class="loading-line"></div>
        <div class="loading-line short"></div>
      </div>
    </main>

    <aside class="outline" aria-label="On this page">
      <div class="outline-top">
        <div class="outline-title">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
          <span>On this page</span>
        </div>
        <nav id="outlineNav"></nav>
      </div>

      <div class="right-rail-bottom">
        <div class="theme-switcher" aria-label="Color theme">
          <button type="button" data-theme-choice="light" aria-label="Use light theme" title="Light">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button type="button" data-theme-choice="system" aria-label="Use system theme" title="System">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
          </button>
          <button type="button" data-theme-choice="dark" aria-label="Use dark theme" title="Dark">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 15.5A8 8 0 0 1 8.5 3.6 8.5 8.5 0 1 0 20.4 15.5Z"/></svg>
          </button>
        </div>

        <a class="contribution-card" href="https://worldspace.cloud" target="_blank" rel="noreferrer">
          <span class="contribution-art" aria-hidden="true">
            <span class="orbit orbit-one"></span>
            <span class="orbit orbit-two"></span>
            <svg viewBox="0 0 64 64"><path d="M20 46h26a11 11 0 0 0 1.2-21.9A16 16 0 0 0 17 19.8 13 13 0 0 0 20 46Z"/><path d="m25 35 6 6 11-14"/></svg>
          </span>
          <span class="contribution-copy">
            <strong>Built with community support</strong>
            <span>Thanks to <b>WorldSpace.cloud</b> for their contribution to the project.</span>
          </span>
          <span class="contribution-link">Visit WorldSpace.cloud <span aria-hidden="true">↗</span></span>
        </a>
      </div>
    </aside>
  </div>

  <dialog class="search-dialog" id="searchDialog" aria-labelledby="searchTitle">
    <div class="search-dialog-inner">
      <div class="search-dialog-header">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.4-3.4"/></svg>
        <h2 id="searchTitle" class="sr-only">Search documentation</h2>
        <input id="searchInput" type="search" placeholder="Search AtomJS docs…" autocomplete="off">
        <kbd>Esc</kbd>
      </div>
      <div class="search-results" id="searchResults" role="listbox"></div>
      <div class="search-dialog-footer"><span>↑↓ Navigate</span><span>↵ Open</span><span>Esc Close</span></div>
    </div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="assets/app.js" defer></script>
</body>
</html>
